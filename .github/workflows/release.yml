name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/openjdk/jdk:21-ubuntu
      options: --user root
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Find jar files
        run: find . -name "*.jar" -type f -not -path "*/\.gradle/*" | head -20

      - name: Get date
        id: date
        run: echo "DATE=$(date +'%m/%d')" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Get existing releases count
        id: count
        run: |
          COUNT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | grep -c "\"tag_name\":\"${{ github.ref_name }}\"" || echo "0")
          echo "COUNT=$COUNT" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "**/build/libs/*.jar,**/build/*.jar"
          tag: ${{ github.ref_name }}
          name: ${{ steps.date.outputs.DATE }} ${{ steps.version.outputs.VERSION }}_${{ steps.count.outputs.COUNT }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
